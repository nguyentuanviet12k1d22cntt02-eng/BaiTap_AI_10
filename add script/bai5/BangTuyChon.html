<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 20px;
    }
    .config-card {
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 24px;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1B365D;
      margin-bottom: 20px;
    }
    .form-check {
      padding: 12px 14px 12px 36px;
      background: #f1f5f9;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .form-check:hover {
      background: #e2e8f0;
    }
    .form-check-input:checked ~ .form-check-label {
      font-weight: 600;
      color: #0f4c81;
    }
    .form-check-input {
      cursor: pointer;
    }
    .btn-run {
      background: #1B365D;
      color: #ffffff;
      border: none;
      font-weight: 600;
      padding: 11px 24px;
      border-radius: 8px;
      width: 100%;
      margin-top: 15px;
      transition: background 0.2s ease;
    }
    .btn-run:hover {
      background: #0f2b4c;
      color: #ffffff;
    }
    .info-badge {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="config-card">
    <div class="header-title">
      Tùy Chọn Quy Tắc Làm Sạch Dữ Liệu
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="chkDedup" checked>
      <label class="form-check-label" for="chkDedup">
        Xóa bỏ mã đơn hàng bị trùng lặp
        <span class="info-badge">Tự động phát hiện và chỉ giữ lại đơn hàng xuất hiện lần đầu tiên</span>
      </label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="chkFixPhone" checked>
      <label class="form-check-label" for="chkFixPhone">
        Tự động sửa chuẩn số điện thoại
        <span class="info-badge">Bỏ dấu chấm, khoảng trắng thừa và tự thêm số 0 vào đầu nếu bị thiếu</span>
      </label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="chkProperName" checked>
      <label class="form-check-label" for="chkProperName">
        Viết hoa chữ cái đầu cho họ và tên
        <span class="info-badge">Xóa khoảng trắng thừa và chuẩn hóa đẹp mắt (Ví dụ: Nguyễn Văn An)</span>
      </label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="chkFilterRev" checked>
      <label class="form-check-label" for="chkFilterRev">
        Loại bỏ đơn hàng có doanh thu nhỏ hơn hoặc bằng 0
        <span class="info-badge">Lọc bỏ triệt để các đơn hàng lỗi doanh thu âm hoặc bằng 0</span>
      </label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="chkSplitChannel" checked>
      <label class="form-check-label" for="chkSplitChannel">
        Tự động tách riêng từng sheet theo kênh bán
        <span class="info-badge">Tạo các trang riêng cho Shopee, Lazada, TikTok Shop, Website</span>
      </label>
    </div>

    <button class="btn-run" onclick="submitConfig()">
      Bắt Đầu Xử Lý Làm Sạch Dữ Liệu (Dưới 2 Giây)
    </button>
  </div>

  <script>
    function submitConfig() {
      const btn = document.querySelector('.btn-run');
      btn.innerText = 'Đang xử lý dữ liệu...';
      btn.disabled = true;

      google.script.run
        .withSuccessHandler(function() {
          google.script.host.close();
        })
        .withFailureHandler(function(err) {
          alert('Có lỗi xảy ra: ' + err.message);
          btn.innerText = 'Thử lại';
          btn.disabled = false;
        })
        .chayLamSachDuLieuNhanh();
    }
  </script>
</body>
</html>
