<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 20px;
    }
    .config-card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 24px;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1B365D;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .form-check {
      padding: 12px 14px 12px 36px;
      background: #f1f5f9;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .form-check:hover {
      background: #e2e8f0;
    }
    .form-check-input:checked ~ .form-check-label {
      font-weight: 600;
      color: #0f4c81;
    }
    .form-check-input {
      cursor: pointer;
    }
    .btn-run {
      background: #1B365D;
      color: #ffffff;
      border: none;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 8px;
      width: 100%;
      margin-top: 15px;
      transition: background 0.2s ease;
    }
    .btn-run:hover {
      background: #0f2b4c;
      color: #ffffff;
    }
    .info-badge {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="config-card">
    <div class="header-title">
      <i class="fa-solid fa-sliders text-primary"></i> Cấu Hình Quy Tắc Làm Sạch Dữ Liệu
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="chkDedup" checked>
      <label class="form-check-label" for="chkDedup">
        Khử trùng lặp mã giao dịch (Deduplication)
        <span class="info-badge">Sử dụng Set() tra cứu O(1), chỉ giữ lại đơn đầu tiên</span>
      </label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="chkFixPhone" checked>
      <label class="form-check-label" for="chkFixPhone">
        Tự động chuẩn hóa số điện thoại
        <span class="info-badge">Xóa dấu chấm, khoảng trắng và tự thêm số "0" vào đầu</span>
      </label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="chkProperName" checked>
      <label class="form-check-label" for="chkProperName">
        Chuẩn hóa viết hoa họ tên (Proper Case)
        <span class="info-badge">Xóa khoảng trắng thừa và viết hoa chữ cái đầu từng từ</span>
      </label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="chkFilterRev" checked>
      <label class="form-check-label" for="chkFilterRev">
        Loại bỏ đơn có doanh thu &le; 0
        <span class="info-badge">Lọc bỏ triệt để các đơn lỗi âm hoặc bằng 0 từ sàn</span>
      </label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="chkSplitChannel" checked>
      <label class="form-check-label" for="chkSplitChannel">
        Tự động chia tách sheet theo từng kênh bán
        <span class="info-badge">Tạo tab riêng cho Shopee, Lazada, TikTok Shop, Website</span>
      </label>
    </div>

    <button class="btn-run" onclick="submitConfig()">
      <i class="fa-solid fa-bolt me-2"></i> Bắt Đầu Xử Lý Ngay (< 2s)
    </button>
  </div>

  <script>
    function submitConfig() {
      const btn = document.querySelector('.btn-run');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Đang xử lý siêu tốc trên RAM...';
      btn.disabled = true;

      google.script.run
        .withSuccessHandler(function() {
          google.script.host.close();
        })
        .withFailureHandler(function(err) {
          alert('Lỗi: ' + err.message);
          btn.innerHTML = '<i class="fa-solid fa-bolt me-2"></i> Thử lại';
          btn.disabled = false;
        })
        .chayLamSachDuLieuInRam();
    }
  </script>
</body>
</html>
